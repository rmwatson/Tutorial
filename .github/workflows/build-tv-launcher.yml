name: Build My Home TV launcher

on:
  push:
    paths:
      - 'tv-launcher/**'
      - '.github/workflows/build-tv-launcher.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tv-launcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../MyHome.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MyHome-apk
          path: MyHome.apk

      - name: Publish download link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: my-home-latest
          name: My Home TV launcher (latest build)
          body: |
            Newest build of the My Home launcher for Android / Google TV.
            Built from ${{ github.sha }} on ${{ github.ref_name }}.
          files: MyHome.apk
          make_latest: false
